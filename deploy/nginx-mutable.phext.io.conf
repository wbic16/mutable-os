# mutable.phext.io — nginx site for mutable-os (Mutable / Codex).
#
# deploy/deploy.sh installs this file. It is the only supported way to put
# it on a host. See deploy/deploy.md for the managed-file marker, the
# MUTABLE_NGINX_FORCE latch, and what a run changes.
#
# On Debian/Ubuntu this file is included from the http block, so the
# limit_req_zone line belongs here and the file must not be wrapped in
# another http { }.
#
# The zone name (mutable_req) is unique to this site: a zone may be defined
# only once per nginx config, and the sibling phext.io sites already define
# their own zones (phext_edit_req, phext_auth on edit.phext.io).
#
# deploy.sh substitutes the domain (mutable.phext.io) and the upstream port
# (127.0.0.1:3003) from DOMAIN and PORT, keeps ssl_certificate paths already
# present on the host, and drops ssl_dhparam when that file is absent.

limit_req_zone $binary_remote_addr zone=mutable_req:10m rate=20r/s;

# Port 80 only redirects. Do not proxy_pass here.
server {
    listen 80;
    listen [::]:80;
    server_name mutable.phext.io;
    server_tokens off;
    return 301 https://mutable.phext.io$request_uri;
}

server {
    # `http2` on listen works through nginx 1.24. On 1.25+ it warns; if
    # `nginx -t` complains, use `listen 443 ssl;` plus `http2 on;` instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mutable.phext.io;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/mutable.phext.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mutable.phext.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16M;

    # Do not add add_header inside the location below: a location that sets
    # any add_header stops inheriting this one.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        limit_req zone=mutable_req burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
